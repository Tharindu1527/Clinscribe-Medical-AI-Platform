# LiteLLM proxy configuration (the only path to LLM providers, ADR-0001).
# Task 3: boots the proxy with its Postgres store. Task 5 adds the model aliases and the
# Gemini -> Groq -> OpenRouter :free -> Ollama fallback chain, budgets and rate limits.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Never store prompt or response text in spend logs (PHI defence in depth)
  store_prompts_in_spend_logs: false

litellm_settings:
  drop_params: true
