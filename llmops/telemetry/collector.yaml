# OpenTelemetry collector: the last stop before traces leave the machine.
# Second PHI defence (SPEC section 7): every span, including LiteLLM's, keeps only allow-listed
# attribute keys and has structured-PHI patterns masked, then goes to Langfuse Cloud (EU,
# ADR-0002) and to a local file that the PHI leak test scans (task 10). The same redacted spans
# become per-stage metrics for Prometheus and Grafana (ADR-0023).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # Calls, errors and a latency histogram per service and span name, from the redacted spans only,
  # so a metric label can only be an allow-listed attribute (ADR-0023)
  spanmetrics:
    histogram:
      unit: ms
      explicit:
        buckets: [25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 3s, 5s, 8s, 13s, 21s, 34s, 60s, 120s, 300s]
    dimensions:
      - name: http.response.status_code
      - name: gen_ai.request.model
    metrics_flush_interval: 15s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  # LiteLLM's internal service spans (auth, router, proxy_pre_call, self, postgres, ...) carry no
  # GenAI data and were most of its span volume, which used up the Langfuse free tier. Keep only
  # its request spans. Eval and batch calls send "no-log", which drops those too.
  filter/litellm_internal:
    error_mode: ignore
    traces:
      span:
        - 'instrumentation_scope.name == "litellm" and name != "litellm_request" and name != "Received Proxy Server Request"'
  redaction:
    allow_all_keys: false
    # Must equal ALLOWED_KEYS in llmops/telemetry/redaction.py (checked by a unit test)
    allowed_keys:
      - gen_ai.operation.name
      - gen_ai.system
      - gen_ai.request.model
      - gen_ai.request.max_tokens
      - gen_ai.request.temperature
      - gen_ai.response.model
      - gen_ai.response.id
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - http.request.method
      - http.response.status_code
      - url.path
      - server.address
      - server.port
      - error.type
      - clinscribe.cache_hit
      - clinscribe.prompt_version
      - clinscribe.encounter_id
      - clinscribe.redacted_attributes
      - service.name
    # RE2 patterns for structured PHI in the values that remain
    blocked_values:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "\\(?\\b\\d{3}\\)?[-. ]?\\d{3}[-. ]?\\d{4}\\b"
      - "\\b\\d{1,2}/\\d{1,2}/\\d{2,4}\\b"
      - "\\b(19|20)\\d{2}-\\d{2}-\\d{2}\\b"
    summary: info
  batch: {}

exporters:
  file/traces:
    path: /artifacts/otel/traces.jsonl
    rotation:  # traces-<time>.jsonl backups; the PHI leak test scans them all (ADR-0023)
      max_megabytes: 100
      max_days: 30
      max_backups: 3
  prometheus:  # scraped by Prometheus (Compose profile obs); inside the Docker network only
    endpoint: 0.0.0.0:8889
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/langfuse

service:
  extensions: [health_check, basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/litellm_internal, redaction, batch]
      exporters: [file/traces, otlphttp/langfuse, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
