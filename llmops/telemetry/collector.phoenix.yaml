# Phoenix trial (ADR-0024; `just phoenix on`): merged over collector.yaml with a second --config.
# Lists replace rather than append, so the trace pipeline's exporters are repeated with Phoenix
# added: Phoenix receives the same redacted spans as the file export and Langfuse.
exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
service:
  pipelines:
    traces:
      exporters: [file/traces, otlphttp/langfuse, spanmetrics, otlphttp/phoenix]
