# Judge for drafted SOAP notes, part 1 of 2: coverage (SPEC section 11: note quality vs reference;
# never used to write notes). Which important facts of the clinician's reference note the draft
# conveys. Part 2 (prompts/judge_note_support.yaml) checks the draft against the transcript. Inputs
# are de-identified (placeholders such as PERSON_1). A larger model than the note writer.
id: judge_note
version: "2"
task: judge_note
temperature: 0.0
max_tokens: 5000              # upper bound; each call asks for what fits Groq's 8k tokens/minute
reasoning_effort: low         # gpt-oss reasons before replying; at full effort the reply did not
                              # fit the room left under that limit (truncated JSON)
max_facts: 30
system: |
  You are a strict auditor of clinical documentation. You compare an AI-drafted SOAP note with
  the clinician's reference note for the same consultation. Names, dates and places appear as
  placeholders (PERSON_1, DATE_1); equal placeholders mean the same thing. Judge only from the
  given texts, never from your own knowledge. Reply with JSON only.
user: |
  REFERENCE NOTE (written by a clinician):
  {reference}

  DRAFT STATEMENTS (number, SOAP section, text):
  {statements}

  List the clinically important facts in the REFERENCE note, most important first, at most
  {max_facts}: symptoms and history, examination findings and results, assessments, and every
  element of the plan (medications with doses, tests, referrals, follow-up). Mark "critical": true
  for facts whose omission could change care (medications and doses, allergies, abnormal results,
  the plan). For each fact, say whether the DRAFT conveys it: "yes", "partial" (part of it, or less
  specific) or "no".
  Reply in exactly this form:
  {{"facts": [{{"fact": "...", "critical": true, "covered": "yes"}}]}}
