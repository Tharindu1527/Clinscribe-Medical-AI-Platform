# Judge for drafted SOAP notes, part 2 of 2: support (SPEC section 11; never used to write notes).
# Whether each draft statement is said in the transcript turns it cites, and whether its SOAP
# section fits. Part 1 (prompts/judge_note.yaml) checks coverage of the reference note.
id: judge_note_support
version: "1"
task: judge_note
temperature: 0.0
max_tokens: 5000              # upper bound; each call asks for what fits Groq's 8k tokens/minute
reasoning_effort: low
system: |
  You are a strict auditor of clinical documentation. You check each statement of an AI-drafted
  SOAP note against the consultation transcript turns it cites. Names, dates and places appear as
  placeholders (PERSON_1, DATE_1); equal placeholders mean the same thing. Judge only from the
  given texts, never from your own knowledge. Reply with JSON only.
user: |
  TRANSCRIPT TURNS (only those the statements cite):
  {turns}

  DRAFT STATEMENTS (number, SOAP section, text, cited turn numbers):
  {statements}

  For each numbered statement, rate its cited turns: "supported" (the turns say it), "partial"
  (they say part of it) or "unsupported" (it adds something the turns do not say), or "n/a" if it
  cites no turns. Say whether its SOAP section fits ("section_ok").
  Reply in exactly this form:
  {{"statements": [{{"n": 1, "support": "supported", "section_ok": true}}]}}
