# Which gateway alias each task uses (SPEC section 7).
# Change only from evaluation results (quality, p95 latency, cost), and note the report that justified it.
version: 1
tasks:
  # Phase 1 pipeline smoke endpoint (task 9)
  dev_complete: clinscribe-default
  # Phase 2 contextual-retrieval prefixes (retrieval/contextual.py): 8k offline calls, local model only
  # (no free-tier quota; reached with the batch key, which cannot call cloud aliases)
  contextual_prefix: clinscribe-fallback-local
  # Phase 2 task 10: cited answers and their evaluation. One generator for every compared pipeline
  # (Groq gpt-oss-20b: the Gemini pool's 20 requests/day per model would force a mid-run model switch);
  # the judge is a larger model, never a fallback target.
  answer_cited: clinscribe-fallback-groq
  judge_citations: clinscribe-judge
  # SPEC section 11 note quality vs reference (evals/agents/note_quality.py): the same judge model,
  # larger than and different from the note writer's
  judge_note: clinscribe-judge
  # Phase 3 agents (agents/graph.py). Primary pool with the full fallback chain; the Phase 3 evals
  # decide whether any task moves.
  note_writer: clinscribe-default
  grade_evidence: clinscribe-default
  rewrite_query: clinscribe-default
