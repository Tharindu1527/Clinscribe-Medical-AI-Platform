[project]
name = "clinscribe"
version = "0.1.0"
description = "Voice-first clinical copilot (portfolio project, synthetic data only)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",          # contracts and validation everywhere
    "pydantic-settings>=2.6", # typed settings loaded from .env, secrets as SecretStr
    "fastapi>=0.115",         # HTTP services (api, deid), per the SPEC stack
    "uvicorn>=0.32",          # ASGI server that runs the FastAPI services
    "httpx>=0.28",            # HTTP client for service-to-service calls and FastAPI's TestClient
    "pyyaml>=6.0",            # read YAML configs (config/models.yaml, prompts/*.yaml)
    "presidio-analyzer>=2.2.364", # PHI detection (SPEC section 8), with custom recognisers
    "en-core-web-md",         # spaCy English model for Presidio's name/location NER (33 MB)
    "cryptography>=46",       # Fernet encryption of the surrogate mapping
    "psycopg[binary]>=3.2",   # Postgres driver (surrogate store, audit table, migrations)
    "opentelemetry-sdk>=1.45",  # tracing with GenAI semantic conventions (SPEC section 7)
    "opentelemetry-exporter-otlp-proto-http>=1.45",  # send spans to the OTel collector
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",      # type stubs so mypy --strict accepts yaml
    "faker>=37",              # seeded fake PHI for the privacy evals and leak test (never real data)
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "finetune"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
# Tests and helper scripts run CLI tools (docker, npm, ollama) found on PATH by design
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
# Seeded pseudo-random synthetic data for evaluations, never used for secrets
"evals/**" = ["S311"]
# The gateway client and the speech-to-speech plugin are the only places allowed to import
# provider SDKs (CLAUDE.md non-negotiable rules, ADR-0001).
"llmops/gateway/**" = ["TID251"]
"voice/agent_s2s.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "Provider SDKs are banned outside llmops/gateway; call the LiteLLM gateway (ADR-0001)."
"anthropic".msg = "Provider SDKs are banned outside llmops/gateway; call the LiteLLM gateway (ADR-0001)."
"groq".msg = "Provider SDKs are banned outside llmops/gateway; call the LiteLLM gateway (ADR-0001)."
"google.genai".msg = "Provider SDKs are banned outside llmops/gateway; call the LiteLLM gateway (ADR-0001)."
"google.generativeai".msg = "Provider SDKs are banned outside llmops/gateway; call the LiteLLM gateway (ADR-0001)."
"litellm".msg = "Use llmops.gateway.client, which talks to the LiteLLM proxy (ADR-0001)."

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
files = ["apps", "agents", "config", "evals", "llmops", "mcp_servers", "privacy", "retrieval", "scripts", "voice", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# basetemp keeps pytest's temporary files on the project drive (D:), not in %TEMP% on C:
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "-m", "not live",
           "--basetemp=.artifacts/pytest"]
markers = [
    "unit: fast, no network, no Docker",
    "integration: needs the Docker stack (just up)",
    "live: calls real free-tier provider APIs (just test-live)",
]
