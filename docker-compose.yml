# ClinScribe stack. Profiles and memory budget: docs/adr/0003-compose-profiles-memory-budget.md
#   just up            -> core + fhir
#   just up rag        -> core + fhir + rag (Qdrant, Neo4j; Phase 2)
# Values come from .env (git-ignored). Each service receives only the variables it needs.
# Ports are bound to 127.0.0.1 only.
name: clinscribe

x-python-service: &python-service
  build: .
  image: clinscribe-python:dev
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- core
  postgres:
    image: postgres:16.15-alpine
    profiles: [core]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run just gen-keys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run just gen-keys}
      POSTGRES_DB: clinscribe
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?run just gen-keys}
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD:?run just gen-keys}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run just gen-keys}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d clinscribe"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [core]
    restart: unless-stopped
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_HOST:-https://cloud.langfuse.com}/api/public/otel
    volumes:
      - ./llmops/telemetry/collector.yaml:/etc/otelcol/config.yaml:ro
      - ./.artifacts/otel:/artifacts/otel
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    # Distroless image: no shell for an in-container healthcheck; the stack test polls :13133.

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    profiles: [core]
    restart: unless-stopped
    mem_limit: 1g
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run just gen-keys}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run just gen-keys}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # Empty = the provider's default endpoint. Set only by `just chaos primary-down on`.
      GEMINI_API_BASE: ${GEMINI_API_BASE_OVERRIDE:-}
      # Set only by `just chaos cloud-down on` (with the Gemini override): Phase 5 exit gate
      GROQ_API_BASE: ${GROQ_API_BASE_OVERRIDE:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE_OVERRIDE:-}
      # Gateway spans go to the collector (redaction, then Langfuse); no message content
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: litellm
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    volumes:
      - ./llmops/gateway/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  deid:
    <<: *python-service
    # DEID_NER=tagger (ADR-0014) needs torch, i.e. the rag image, and the merged model mounted below;
    # the defaults (spaCy, app image) are what CI runs
    build:
      context: .
      target: ${DEID_TARGET:-app}
    image: ${DEID_IMAGE:-clinscribe-python:dev}
    profiles: [core]
    mem_limit: ${DEID_MEM_LIMIT:-2560m}  # 3 workers x ~0.4-0.5 GB (spaCy model per process)
    # 3 workers (Phase 6 load test): one process queued to p95 26 s at 10+ sessions
    command: ["uvicorn", "privacy.deid.app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "3"]
    environment:
      POSTGRES_HOST: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DEID_MAPPING_KEY: ${DEID_MAPPING_KEY:?run just gen-keys}
      DEID_REIDENTIFY_KEY: ${DEID_REIDENTIFY_KEY:?run just gen-keys}
      DEID_SPACY_MODEL: ${DEID_SPACY_MODEL:-en_core_web_md}
      DEID_NER: ${DEID_NER:-spacy}
      DEID_TAGGER_PATH: /app/data/finetune/deid_ner_tagger
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./data/finetune/deid_ner_tagger:/app/data/finetune/deid_ner_tagger:ro
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *python-service
    profiles: [core]
    mem_limit: 512m
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?run just gen-keys}
      # load tests swap in the mock-only key (evals/load/load_test.py); otherwise the app key
      LITELLM_APP_KEY: ${LITELLM_APP_KEY_OVERRIDE:-${LITELLM_APP_KEY:?run just gen-keys}}
      GATEWAY_URL: http://litellm:4000
      DEID_URL: http://deid:8001
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Phase 3: agent tools over MCP, approval and auth keys
      GUIDELINES_MCP_URL: http://guidelines-mcp:8010/mcp
      DRUGGRAPH_MCP_URL: http://druggraph-mcp:8011/mcp
      FHIR_MCP_URL: http://fhir-mcp:8012/mcp
      APPROVAL_TOKEN_KEY: ${APPROVAL_TOKEN_KEY:?run just gen-keys}
      AUTH_TOKEN_KEY: ${AUTH_TOKEN_KEY:?run just gen-keys}
      DEID_REIDENTIFY_KEY: ${DEID_REIDENTIFY_KEY:?run just gen-keys}
      # signs LiveKit room tokens for the browser's Voice tab (ADR-0019)
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run just gen-keys}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run just gen-keys}
      DEV_LOGIN: ${DEV_LOGIN:-false}
      CLINSCRIBE_MODEL_OVERRIDE: ${CLINSCRIBE_MODEL_OVERRIDE:-}  # load tests: clinscribe-mock
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- fhir
  # fhir-mcp (Phase 3): patient context and approval-gated writes over MCP
  fhir-mcp:
    <<: *python-service
    profiles: [fhir]
    mem_limit: 256m
    command: ["python", "-m", "mcp_servers.fhir_mcp", "--http", "0.0.0.0:8012"]
    environment:
      POSTGRES_HOST: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?run just gen-keys}
      APPROVAL_TOKEN_KEY: ${APPROVAL_TOKEN_KEY:?run just gen-keys}
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
    ports:
      - "127.0.0.1:8012:8012"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8012), 3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  hapi-fhir:
    image: hapiproject/hapi:v8.12.0-2
    profiles: [fhir]
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1280m -XX:MaxMetaspaceSize=256m"
      hapi.fhir.fhir_version: R4
      spring.datasource.url: jdbc:postgresql://postgres:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: ${HAPI_DB_PASSWORD}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    ports:
      - "127.0.0.1:8080:8080"
    # Distroless image: no shell for an in-container healthcheck; the stack test polls /fhir/metadata.

  # ---------------------------------------------------------------- rag (Phase 2)
  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: [rag]
    restart: unless-stopped
    mem_limit: 1g
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run just gen-keys}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      # No curl or wget in the image; bash can open a TCP connection. /readyz is checked by the tests.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26.31-community
    profiles: [rag]
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run just gen-keys}
      NEO4J_server_memory_heap_initial__size: 768m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # druggraph-mcp (Phase 3): DDInter interactions over MCP; reads the drug lexicon from data/graph
  druggraph-mcp:
    <<: *python-service
    profiles: [rag]
    mem_limit: 256m
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["python", "-m", "mcp_servers.druggraph_mcp", "--http", "0.0.0.0:8011"]
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?run just gen-keys}
      NEO4J_HTTP_URL: http://neo4j:7474
    volumes:
      - ./data/graph:/app/data/graph:ro
    ports:
      - "127.0.0.1:8011:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8011), 3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Retrieval as an MCP service (Phase 3 task 3): the only container with torch and the encoders.
  # Models come from the host's Hugging Face cache and the corpus/indexes from ./data, both
  # read-only; offline mode, so nothing is downloaded at run time.
  guidelines-mcp:
    build:
      context: .
      target: rag
    image: clinscribe-python-rag:dev
    profiles: [rag]
    restart: unless-stopped
    mem_limit: 2560m
    depends_on:
      qdrant:
        condition: service_healthy
      deid:
        condition: service_healthy
        required: false  # core profile; `just up rag` starts it too
    command: ["python", "-m", "mcp_servers.guidelines_mcp", "--http", "0.0.0.0:8010"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?run just gen-keys}
      DEID_URL: http://deid:8001
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: "1"
      CHAOS_SEARCH_DELAY_MS: ${CHAOS_SEARCH_DELAY_MS:-}  # incident drill only (docs/postmortems)
      TRANSFORMERS_OFFLINE: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      # long form: a Windows path in HF_HOME contains a colon. Not `:?`: every `--profile "*"`
      # command (just ps/down, CI logs) interpolates this service, and CI has no HF_HOME
      - type: bind
        source: ${HF_HOME:-./data/hf-cache}
        target: /hf-cache
        read_only: true
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      # loading the encoders and the BM25 index takes about a minute on CPU
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Browser voice over WebRTC (ADR-0019): `just up voice`, then `just voice dev` (the agent worker on
  # the host) and the Voice tab of the review UI. Ports on 127.0.0.1 only; media on one UDP port.
  livekit:
    image: livekit/livekit-server:v1.13.9
    profiles: [voice]
    mem_limit: 256m
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run just gen-keys}: ${LIVEKIT_API_SECRET:?run just gen-keys}"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped

  # Vector-store comparison only (task 11, ADR-0007): Postgres + pgvector, separate from the core
  # Postgres so the comparison cannot touch app, LiteLLM or HAPI data.
  pgvector:
    image: pgvector/pgvector:0.8.6-pg16
    profiles: [vectorstore]  # `just up vectorstore`; not part of `just up rag`
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: vectors
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?run just gen-keys}
      POSTGRES_DB: vectors
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "maintenance_work_mem=256MB"]
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vectors", "-d", "vectors"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- tools (one-shot)
  # Synthetic patients (Synthea v4.0.0, Apache-2.0). Run by `just fhir-load`, never by `just up`.
  synthea:
    image: eclipse-temurin:21.0.12.1_1-jre-noble
    profiles: [tools]
    mem_limit: 1g
    working_dir: /synthea
    volumes:
      - ./data/synthea:/synthea
    command:
      - java
      - -Xmx768m
      - -jar
      - synthea-with-dependencies.jar
      - -p
      - "${SYNTHEA_POPULATION:-50}"
      - -s
      - "${SYNTHEA_SEED:-42}"
      - -cs
      - "${SYNTHEA_SEED:-42}"
      - -r
      - "20260101"
      - --generate.only_alive_patients=true
      - --exporter.baseDirectory=/synthea/output/
      - --exporter.fhir.export=true
      - --exporter.hospital.fhir.export=true
      - --exporter.practitioner.fhir.export=true
      - --exporter.ccda.export=false
      - --exporter.csv.export=false
      - --exporter.years_of_history=10

volumes:
  pgdata:
  qdrant_data:
  neo4j_data:
  pgvector_data:
