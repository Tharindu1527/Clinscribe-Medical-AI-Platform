# Self-hosted LiveKit server for browser voice (ADR-0019; `just up voice`). One machine: the browser,
# the voice agent worker (`just voice dev`) and this server all reach it on 127.0.0.1, so ICE
# candidates use that address and WebRTC media goes through one UDP port (plus TCP as a fallback).
# API key and secret come from LIVEKIT_KEYS (generated by `just gen-keys`), never from this file.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
room:
  empty_timeout: 300  # seconds an empty room is kept
logging:
  level: info
