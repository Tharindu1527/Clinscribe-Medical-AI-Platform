# Prometheus for the ClinScribe dashboards (ADR-0023; Compose profile obs). One target: the
# OpenTelemetry collector's span metrics (calls, errors, latency per service and span name), made
# from redacted spans only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]
